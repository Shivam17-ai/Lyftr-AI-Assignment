services:
  # Backend Web Service
  - type: web
    name: llm-failover-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODELS
        value: groq/qwen/qwen3.8-27b,groq/qwen/qwen3.8-27b
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful, concise assistant.
      - key: LLM_TEMPERATURE
        value: "0"
      - key: LLM_MAX_TOKENS
        value: "1024"
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: CACHE_TYPE
        value: local
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
